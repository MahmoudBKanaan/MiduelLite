services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minduel}
      POSTGRES_USER: ${POSTGRES_USER:-minduel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minduel}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minduel} -d ${POSTGRES_DB:-minduel}"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-minduel}:${POSTGRES_PASSWORD:-minduel}@database:5432/${POSTGRES_DB:-minduel}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
